name: Tarefas API CI Pipeline

#teste
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tarefas-backend-pipeline:
    name: Qualidade, Tipos e Build - Tarefas API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar o Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Instalar dependências (workspace inteiro)
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter backend run lint

      - name: Prettier
        run: pnpm --filter backend run format:check

      - name: Checagem de tipos
        run: pnpm --filter backend run type-check

      - name: Build do backend
        run: pnpm --filter backend run build

      - name: Build da imagem Docker
        run: docker build -t api-tarefas:latest ./backend

      - name: Build do frontend
        run: pnpm --filter app run build