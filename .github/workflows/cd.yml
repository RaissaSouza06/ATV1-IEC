name: Monorepo CD Pipeline (Entrega de Produção)

on:
  # Dispara automaticamente a cada push na branch main
  push:
    branches:
      - main
  # Permite disparo manual pelo painel web do GitHub Actions
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  integracao-continua:
    name: 1. Integração Contínua (Tipos e Build)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Instalar pnpm
        run: npm install -g pnpm@11.28.0

      - name: 3. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 4. Instalar Dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 5. Checagem Estática de Tipos
        run: pnpm --filter ./backend type-check

      - name: 6. Build do Backend
        run: pnpm --filter ./backend build

  validar-imagem-docker:
    name: 2. Validar Build da Imagem Docker
    needs: [integracao-continua]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: 2. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Compilar Imagem (Build com Cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: meu-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 4. Resumo da Validação no Step Summary
        run: |
          echo "### Imagem Docker Validada com Sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerfile**: \`./Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-render:
    name: 3. Disparar Deploy no Render
    needs: [integracao-continua, validar-imagem-docker]
    runs-on: ubuntu-latest

    steps:
      - name: 1. Disparar Webhook de Deploy no Render
        run: |
          echo "Disparando deploy na nuvem do Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Resposta do Render: $HTTP_BODY"
          echo "Codigo de Status HTTP: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Falha ao acionar o Deploy Hook no Render (Status $HTTP_STATUS)!"
            exit 1
          fi

      - name: 2. Publicar Resumo do Deploy no Painel do GitHub
        run: |
          echo "### Deploy Acionado com Sucesso no Render" >> $GITHUB_STEP_SUMMARY
          echo "- **Ambiente**: Produção (Render Web Service)" >> $GITHUB_STEP_SUMMARY
          echo "- **Gatilho**: Deploy Hook via GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Sincronização iniciada com a branch main" >> $GITHUB_STEP_SUMMARY